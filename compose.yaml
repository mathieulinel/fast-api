version: '2.0'
services:
  api:
    environment:
      - DB=${DB}
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATA_DIR=${DATA_DIR}
    build:
      context: .
    depends_on:
      postgres-db:
        condition: service_healthy

    container_name: fastapi-application
    ports:
      - 8000:8000
    ## sqlite config
    # volumes:
    #   - ./database.db:/app/database.db
    #   - ./data:/app/data
  postgres-db:
    container_name: postgres-db
    image: postgres:17
    environment:
      - DB=${DB}
      - POSTGRES_DB=${DB_NAME}
      - DB_HOST=${DB_HOST}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    # volumes:
    #   - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: "pg_isready -h postgres-db" 
      interval: 1s
      timeout: 5s
      retries: 5

volumes: 
  postgres-db:

